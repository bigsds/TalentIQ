version: '3.8'

# ═══════════════════════════════════════════════════════════════════════════════
# SoftTalent — docker-compose.yml (production)
#
# Adapté pour un VPS avec Traefik + N8n déjà en place.
# Ce fichier déploie uniquement : PostgreSQL+pgvector + SoftTalent (Next.js)
#
# ⚙️  Avant de lancer :
#   1. Copier .env.example en .env et remplir toutes les valeurs
#   2. Vérifier le nom du réseau Traefik : docker inspect root-traefik-1 \
#        --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}\n{{end}}'
#   3. Remplacer TRAEFIK_NETWORK ci-dessous par le vrai nom si différent de "proxy"
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ─── Base de données (PostgreSQL + pgvector) ────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: softtalent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hg_recrutement}
      POSTGRES_USER: ${POSTGRES_USER:-hg_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hg_user} -d ${POSTGRES_DB:-hg_recrutement}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ─── SoftTalent (Next.js) ───────────────────────────────────────────────────
  softtalent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: softtalent_app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hg_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hg_recrutement}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      N8N_BASE_URL: ${N8N_BASE_URL:-}
      N8N_WEBHOOK_NOUVEAU_MANDAT: ${N8N_WEBHOOK_NOUVEAU_MANDAT:-/webhook/hg-nouveau-mandat}
      N8N_WEBHOOK_RECHERCHE: ${N8N_WEBHOOK_RECHERCHE:-/webhook/hg-recherche}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-SoftTalent}
      NEXT_PUBLIC_CABINET_NOM: ${NEXT_PUBLIC_CABINET_NOM:-}
      NEXT_PUBLIC_PRIMARY_COLOR: ${NEXT_PUBLIC_PRIMARY_COLOR:-#1F4E79}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - traefik_network   # ← remplace par le vrai nom du réseau Traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.softtalent.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.softtalent.entrypoints=websecure"
      - "traefik.http.routers.softtalent.tls.certresolver=letsencrypt"
      - "traefik.http.services.softtalent.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik_network"   # ← même valeur

networks:
  # Réseau Traefik existant — vérifier le nom avec :
  # docker inspect root-traefik-1 --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}\n{{end}}'
  traefik_network:   # ← remplacer si différent de "proxy"
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}   # configurable via .env

  # Réseau interne entre softtalent et postgres
  # Le N8n existant doit être connecté à ce réseau pour accéder à la DB
  # Après le déploiement : docker network connect softtalent_internal n8n
  internal:
    name: softtalent_internal
    driver: bridge

volumes:
  postgres_data:
